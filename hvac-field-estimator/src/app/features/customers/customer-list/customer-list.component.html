<div class="container py-4">

  <div class="mb-4">
    <a routerLink="/dashboard" class="text-decoration-none small">
      <i class="bi bi-arrow-left me-1"></i>
      Dashboard
    </a>

    <h1 class="h2 fw-bold mt-3 mb-1">Customers</h1>
    <p class="text-secondary mb-0">
      Find the customer you're servicing.
    </p>
  </div>

  <div class="input-group input-group-lg mb-4">
    <span class="input-group-text bg-white">
      <i class="bi bi-search"></i>
    </span>

    <input
      type="text"
      class="form-control"
      placeholder="Search name, address, or ID..."
      [(ngModel)]="searchTerm"
    >
  </div>

  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-primary"></div>
  </div>

  <div
    *ngIf="!loading && filteredCustomers.length === 0"
    class="text-center py-5"
  >
    <i class="bi bi-person-x display-5 text-secondary"></i>
    <h2 class="h5 mt-3">No customers found</h2>
    <p class="text-secondary">
      Try another search.
    </p>
  </div>

  <div class="d-grid gap-3">
    <a
      *ngFor="let customer of filteredCustomers"
      [routerLink]="['/customers', customer.id]"
      class="card customer-card shadow-sm p-3 text-decoration-none text-dark"
    >
      <div class="d-flex justify-content-between align-items-start">
        <div>
          <h2 class="h5 mb-1">{{ customer.name }}</h2>

          <p class="text-secondary small mb-2">
            <i class="bi bi-geo-alt me-1"></i>
            {{ customer.address }}
          </p>
        </div>

        <span
          class="badge"
          [class.bg-primary-subtle]="customer.propertyType === 'residential'"
          [class.text-primary]="customer.propertyType === 'residential'"
          [class.bg-warning-subtle]="customer.propertyType === 'commercial'"
          [class.text-warning-emphasis]="customer.propertyType === 'commercial'"
        >
          {{ customer.propertyType }}
        </span>
      </div>

      <div class="border-top pt-2 mt-1">
        <div class="row small">
          <div class="col-6">
            <span class="text-secondary">System</span>
            <div class="fw-medium">{{ customer.systemType }}</div>
          </div>

          <div class="col-6">
            <span class="text-secondary">Size</span>
            <div class="fw-medium">
              {{ customer.squareFootage | number }} sq ft
            </div>
          </div>
        </div>
      </div>

      <div class="text-end mt-2">
        <span class="text-primary small fw-semibold">
          View customer
          <i class="bi bi-chevron-right"></i>
        </span>
      </div>
    </a>
  </div>

</div>
